services:
  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lms_db
      TZ: Europe/Istanbul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  mysql_data:
